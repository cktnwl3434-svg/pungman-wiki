<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>풍만위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface2:#f5f8f6; --text:#1b2420; --muted:#5d6b65;
  --line:#d4ddd8; --line2:#e6ece9;
  --head:#1d6a4f; --head2:#175a43; --head-text:#ffffff;
  --accent:#1c7a57; --accent-text:#ffffff; --link:#1f62b3; --red:#cc3a2a;
  --code-bg:#eef2f0; --mark:#fff0a8;
  --ins:#dcf2e3; --ins-t:#1a5a34; --del:#fbe2de; --del-t:#8a2a1f;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1412; --surface:#171d1a; --surface2:#1d2521; --text:#e2eae6; --muted:#94a49c;
    --line:#2b3530; --line2:#232c28;
    --head:#153f30; --head2:#113427; --head-text:#eaf4ef;
    --accent:#3fae84; --accent-text:#0b1a14; --link:#79b3f4; --red:#ff7d6c;
    --code-bg:#212a26; --mark:#5c5220;
    --ins:#173826; --ins-t:#9fe0b7; --del:#3d1d19; --del-t:#ffb4a8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1412; --surface:#171d1a; --surface2:#1d2521; --text:#e2eae6; --muted:#94a49c;
  --line:#2b3530; --line2:#232c28;
  --head:#153f30; --head2:#113427; --head-text:#eaf4ef;
  --accent:#3fae84; --accent-text:#0b1a14; --link:#79b3f4; --red:#ff7d6c;
  --code-bg:#212a26; --mark:#5c5220;
  --ins:#173826; --ins-t:#9fe0b7; --del:#3d1d19; --del-t:#ffb4a8;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.75 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--link)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-text);box-shadow:0 1px 0 var(--head2)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:10px;min-height:56px}
.logo{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-weight:700;font-size:18px;white-space:nowrap;letter-spacing:-.01em}
.logo svg{flex:none}
.nav{display:flex;gap:2px}
.nav a{color:inherit;text-decoration:none;font-size:14px;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:.92}
.nav a:hover{background:rgba(255,255,255,.14);opacity:1}
.search{margin-left:auto;position:relative;flex:0 1 300px;display:flex}
.search input{width:100%;height:36px;border:0;border-radius:6px 0 0 6px;padding:0 10px;background:var(--surface);color:var(--text);min-width:0}
.search button{height:36px;white-space:nowrap;flex:none;border:0;border-radius:0 6px 6px 0;padding:0 12px;background:var(--head2);color:var(--head-text);cursor:pointer;font-size:14px}
.sugg{position:absolute;top:40px;left:0;right:0;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden}
.sugg a{display:block;padding:7px 12px;color:var(--text);text-decoration:none;font-size:14px}
.sugg a:hover,.sugg a.on{background:var(--surface2)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.me a{color:inherit}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;padding-block:8px;gap:8px}
  .nav{order:3;width:100%;overflow-x:auto}
  .search{order:2;flex:1 1 100%;margin-left:0}
  .me{margin-left:auto}
  .me .nm{display:none}
}

/* main */
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 28px 28px}
@media (max-width:600px){.doc{padding:16px 14px 22px}}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1.title{margin:0;font-size:30px;line-height:1.3;font-weight:700;text-wrap:balance;letter-spacing:-.015em}
h1.title .pre{color:var(--muted);font-weight:500}
h1.title small{font-size:15px;color:var(--muted);font-weight:500;margin-left:6px}
.btns{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.btns a,.btns button{display:block;padding:6px 13px;font-size:13px;color:var(--text);text-decoration:none;background:var(--surface);border:0;border-left:1px solid var(--line);cursor:pointer}
.btns>:first-child{border-left:0}
.btns a:hover,.btns button:hover{background:var(--surface2)}
.btns .pri{background:var(--accent);color:var(--accent-text)}
.btns .pri:hover{background:var(--accent);filter:brightness(1.06)}
.meta{color:var(--muted);font-size:13px;text-align:right;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.notice{border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:8px 12px;font-size:14px;margin:0 0 14px}
.notice.warn{border-color:var(--red);color:var(--text)}
.cats{border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:5px 12px;font-size:13px;margin-bottom:16px}
.cats b{margin-right:6px}
.cats a{margin-right:4px}
.cats .sep{color:var(--muted);margin-right:4px}

/* wiki content */
.content{font-size:15px}
.content p{margin:0 0 10px}
.content .h{margin:30px 0 12px;padding-bottom:5px;border-bottom:1px solid var(--line);font-weight:700;line-height:1.4;scroll-margin-top:84px;text-wrap:balance}
.content .l0{font-size:1.75em}.content .l1{font-size:1.5em}.content .l2{font-size:1.3em}.content .l3{font-size:1.15em}.content .l4,.content .l5{font-size:1.05em}
.content .h .num{color:var(--accent);text-decoration:none;margin-right:2px}
.toc{display:inline-block;max-width:100%;min-width:220px;border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:10px 20px 12px 16px;margin:4px 0 12px;scroll-margin-top:84px}
.toc-h{font-weight:700;font-size:16px;margin-bottom:4px}
.toc-i{font-size:14px;line-height:1.9}
.toc-i a{color:var(--text);text-decoration:none}
.toc-i a:hover{text-decoration:underline}
.toc-i .num{color:var(--accent);margin-right:4px}
a.wl{color:var(--link);text-decoration:none}
a.wl:hover{text-decoration:underline}
a.wl.red{color:var(--red)}
a.ext{color:var(--link);text-decoration:none}
a.ext::after{content:"↗";font-size:.78em;margin-left:2px;opacity:.8}
.content ul,.content ol{margin:4px 0 10px;padding-left:1.6em}
.content li{margin:2px 0}
.content hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.content blockquote{margin:10px 0;padding:10px 14px;background:var(--surface2);border:1px dashed var(--line);border-left:4px solid var(--accent)}
.content blockquote>:last-child{margin-bottom:0}
.tw{overflow-x:auto;margin:8px 0 12px}
.content table{border-collapse:collapse}
.content td{border:1px solid var(--line);padding:5px 10px;vertical-align:middle}
pre.code{background:var(--code-bg);border:1px solid var(--line2);border-radius:4px;padding:12px 14px;overflow-x:auto;font:13px/1.6 var(--mono);white-space:pre;margin:8px 0 12px}
.content code{font:.88em var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:3px}
.content details.fold{border:1px solid var(--line);border-radius:4px;margin:8px 0 12px}
.content details.fold>summary{cursor:pointer;padding:6px 12px;background:var(--surface2);font-weight:600}
.content details.fold>div{padding:10px 14px}
.content .wikibox{margin:8px 0}
.sz-p1{font-size:1.2em}.sz-p2{font-size:1.4em}.sz-p3{font-size:1.65em}.sz-p4{font-size:1.9em}.sz-p5{font-size:2.2em}
.sz-m1{font-size:.9em}.sz-m2{font-size:.8em}.sz-m3{font-size:.7em}.sz-m4{font-size:.62em}.sz-m5{font-size:.55em}
sup.fn a{color:var(--link);text-decoration:none;font-size:.8em;margin-left:1px}
.fns{border-top:1px solid var(--line);margin-top:30px;padding-top:10px;font-size:13px;color:var(--text)}
.fn-i{margin:3px 0;scroll-margin-top:84px}
.fn-i>a{text-decoration:none;margin-right:4px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--mark)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;cursor:pointer;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;font-size:14px}
.field input{height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--surface)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* editor */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:14px 0 0}
.tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 16px;cursor:pointer;font-size:14px;color:var(--muted);border-radius:6px 6px 0 0;margin-bottom:-1px}
.tabs button.on{border-color:var(--line);background:var(--surface);color:var(--text);font-weight:600}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:8px 0}
.toolbar button{border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:3px 10px;font-size:13px;cursor:pointer}
.toolbar button:hover{background:var(--line2)}
#ed-text{width:100%;min-height:52vh;border:1px solid var(--line);border-radius:4px;padding:12px;font:14px/1.65 var(--mono);background:var(--surface);resize:vertical;tab-size:4}
.preview{border:1px solid var(--line);border-top:0;padding:16px 18px;min-height:30vh}
.savebar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.savebar .field{flex:1 1 280px;margin:0}
.help{margin-top:16px;font-size:13px}
.help summary{cursor:pointer;color:var(--muted)}
.help table{border-collapse:collapse;margin-top:8px}
.help td{border:1px solid var(--line);padding:4px 10px;vertical-align:top}
.help td:first-child{font-family:var(--mono);white-space:pre;font-size:12.5px}
.msg{font-size:14px;margin-top:10px}
.msg.err{color:var(--red)}

/* lists */
.lst{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line2)}
.lst li{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;padding:8px 4px;border-bottom:1px solid var(--line2);font-size:14px;align-items:baseline}
.lst time,.lst .t{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.lst .sub{grid-column:2;color:var(--muted);font-size:13px}
.lst .sub em{font-style:normal}
@media (max-width:600px){.lst li{grid-template-columns:1fr}.lst .sub{grid-column:1}}
.rv{font-family:var(--mono);font-size:13px;font-weight:500}
.plus{color:var(--ins-t);font-family:var(--mono);font-size:12.5px}
.minus{color:var(--del-t);font-family:var(--mono);font-size:12.5px}
.zero{color:var(--muted);font-family:var(--mono);font-size:12.5px}
.acts{display:inline-flex;gap:8px;margin-left:6px;font-size:13px}
.acts a,.acts button{background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-decoration:none;font-size:13px}
.snip{color:var(--muted);font-size:13px}
.snip mark{background:var(--mark);color:inherit}
.cols{columns:3 220px;column-gap:24px;margin-top:12px;font-size:14px}
.cols .grp{break-inside:avoid;margin-bottom:12px}
.cols .grp b{display:block;color:var(--accent);border-bottom:1px solid var(--line2);margin-bottom:4px}
.cols a{display:block}

/* diff */
.diff{font:13px/1.6 var(--mono);border:1px solid var(--line);border-radius:4px;overflow-x:auto;margin-top:12px}
.diff div{padding:0 10px;white-space:pre-wrap;min-height:1.6em}
.diff .a{background:var(--ins);color:var(--ins-t)}
.diff .d{background:var(--del);color:var(--del-t)}
.diff .s{color:var(--muted);background:var(--surface2);font-style:italic}

/* gate screens */
.gate{max-width:560px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:32px 24px}
.gate h1{font-size:22px;margin:12px 0 8px}
.gate p{color:var(--muted);margin:6px 0}
.muted{color:var(--muted)}
.foot{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 30px;color:var(--muted);font-size:12px}
.skel{height:14px;border-radius:4px;background:var(--line2);margin:10px 0}

.logout{background:none;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer}
.me a{text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:3px 10px}
.login{text-align:left}
.login h1,.login>p{text-align:center}
.lform{margin-top:18px}
.lform .field input{height:42px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.p-wait{background:var(--mark);color:var(--text)}
.p-ok{background:var(--ins);color:var(--ins-t)}
.p-no{background:var(--del);color:var(--del-t)}
.ytw{display:block;max-width:100%;margin:6px 0}
.ytw iframe{width:100%;height:100%;border:0;border-radius:6px;display:block}
.who{font-weight:500}

/* 나무마크 추가 요소 */
.content .indent{padding-left:1.2em}
.content .h{cursor:pointer;display:flex;align-items:baseline;gap:8px}
.content .h .hl{flex:1 1 auto}
.content .h .hedit{font-size:13px;font-weight:400;color:var(--link);text-decoration:none;flex:none}
.content .h.folded{color:var(--muted)}
.content .h.folded .ht::after{content:" (접힘)";font-size:.6em;font-weight:400}
.content table{border:1px solid var(--tb,var(--line))}
.content td{border-color:var(--tb,var(--line))}
.content caption{caption-side:top;font-weight:600;padding:4px 0}
.content .on-light{color:#1b2420}
.content .on-light a.wl{color:#1f62b3}
.content .on-light a.wl.red{color:#cc3a2a}
.content ruby rt{font-size:.6em;color:var(--muted)}
.content .clearfix{display:block;clear:both}
.content .include{margin:6px 0}
.content .err{color:var(--red);font-size:.9em}
.content .math math{font-size:1.1em}
.content pre.code[data-lang]::before{content:attr(data-lang);display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.content a.imgl{display:inline-block;max-width:100%}
.content a.imgl img{max-width:100%;vertical-align:middle}
.content .ia-c{display:block;text-align:center}
.content .ia-l{float:left;margin:4px 14px 8px 0}
.content .ia-r{float:right;margin:4px 0 8px 14px}
.content::after{content:"";display:block;clear:both}
.th-dark{display:none}
a.yt{display:inline-flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);text-decoration:none;margin:4px 0}
a.yt:hover{border-color:var(--accent)}
a.yt small{display:block;color:var(--muted);font-size:12px}
.yt-play{display:grid;place-items:center;width:40px;height:28px;border-radius:7px;background:#e3342f;color:#fff;font-size:13px}
.filebox{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:14px;margin:0 0 16px;text-align:center}
.filebox img{max-height:480px;border-radius:4px}
.filebox .muted{font-size:13px;margin-top:8px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .dk-bg{background:var(--d-bg)!important}
  :root:not([data-theme="light"]) .dk-c{color:var(--d-c)!important}
  :root:not([data-theme="light"]) .dk-tb{--tb:var(--d-tb)!important}
  :root:not([data-theme="light"]) .th-dark{display:inline}
  :root:not([data-theme="light"]) .th-light{display:none}
}
:root[data-theme="dark"] .dk-bg{background:var(--d-bg)!important}
:root[data-theme="dark"] .dk-c{color:var(--d-c)!important}
:root[data-theme="dark"] .dk-tb{--tb:var(--d-tb)!important}
:root[data-theme="dark"] .th-dark{display:inline}
:root[data-theme="dark"] .th-light{display:none}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>

const ID_DOMAIN = "pungman.wiki";   // 아이디를 이메일 형식으로 바꿀 때 쓰는 가짜 도메인 (바꾸지 말 것)

</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="#" id="logo">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 20v-8M13 12c0-3 2-5 5-5-.2 3-2 5-5 5zM13 14c0-2.6-1.8-4.4-4.6-4.4.2 2.6 1.8 4.4 4.6 4.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="logo-name">위키</span>

    <nav class="nav" id="nav">
      <a href="#recent">최근 변경</a>

      <a href="#random">랜덤</a>
      <a href="#upload">파일 올리기</a>
      <a href="#" id="nav-help">문법 도움말</a>
    </nav>
    <form class="search" id="sform" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="문서 검색 또는 이동" aria-label="문서 검색">
      <button type="submit">이동</button>
      <div class="sugg" id="sugg" hidden></div>
    </form>
    <div class="me" id="me"></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="doc"><div class="skel" style="width:40%;height:28px"></div><div class="skel"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:70%"></div></div>
</main>
<div class="foot" id="foot"></div>

<script>
(function(){
"use strict";
/* ---------------- state ---------------- */
const main=document.getElementById('main');
let db=null,auth=null,myId=null,myName='',isOwner=false,meInfo=null,userUnsub=null,pagesUnsub=null;
let access='checking';            // checking | login | pending | blocked | setup | ok
let site={name:'풍만위키',front:'대문',help:'풍만위키:문법 도움말'};
let pendingAnchor=null;
const pages=new Map();            // pid -> page data
let pagesReady=false;
let renderSeq=0;
let editState=null;
let redirectFrom=null;
const revCache=new Map();
const LIVE=new Set(['w','wr','front','recent','all','search','backlinks']);

function findClose(s,start,open,close){

    else if(s.startsWith(open,j)){ depth++; j+=open.length-1; }

}
function fmt(h){
  return h
    .replace(/'''(.+?)'''/g,'<strong>$1</strong>')
    .replace(/''(.+?)''/g,'<em>$1</em>')

    .replace(/--(.+?)--/g,'<del>$1</del>')

/* 색: "#f00", "red", "#888,#ff0"(라이트,다크) */
function colorVal(v){

}
function lum(hex){

function safeStyle(css){

function renderBrace(inner,ctx){
  let m=inner.match(/^#(\S+?)\s([\s\S]*)$/);
  if(m && !inner.startsWith('#!')){ const c=colorVal(m[1]); if(c){ const d=new Deco(); d.fg(m[1]); return `<span${d.attr()}>${inline(m[2],ctx)}</span>`; } }
  m=inner.match(/^([+-])([1-5])\s([\s\S]*)$/);
  if(m) return `<span class="sz-${m[1]==='+'?'p':'m'}${m[2]}">${inline(m[3],ctx)}</span>`;

}
function safeUrl(u){ try{ return encodeURI(decodeURI(u)); }catch(e){ return encodeURI(u); } }
function parentOf(t){ const k=t.lastIndexOf('/'); return k>0?t.slice(0,k):t; }
function renderLink(inner,ctx){

  const shown=un(target);
  const lab=()=>label!=null?inline(label,ctx):esc(shown);
  if(/^분류:/.test(target)){ const c=normTitle(un(target.slice(3).replace(/#blur$/i,''))); if(c&&!ctx.noCats) ctx.cats.push(c); return ''; }
  if(/^파일:/.test(target)) return renderImage(un(target.slice(3)),label,ctx);

  return `<a class="wl${ex?'':' red'}" href="#w/${enc(title)}"${anchor?` data-anchor="${esc(anchor)}"`:''} title="${esc(title)}">${lab()}</a>`;
}
function renderImage(name,opts,ctx){

  const o={};
  String(opts||'').split('&').forEach(kv=>{ const k=kv.indexOf('='); if(k>0) o[kv.slice(0,k).trim().toLowerCase()]=kv.slice(k+1).trim(); });
  const d=new Deco();

  if(sizeVal(o['border-radius'])) d.st.push('border-radius:'+sizeVal(o['border-radius']));
  if(/^(fill|contain|cover|none|scale-down)$/.test(o['object-fit']||'')) d.st.push('object-fit:'+o['object-fit']);

  return `<a class="imgl${al?' '+al:''}" href="#w/${enc(title)}"><img data-fid="${pidOf(title)}" alt="${esc(name)}"${fp.file.w?` width="${+fp.file.w}" height="${+fp.file.h}"`:''}${d.attr()}></a>`;
}
function renderFn(inner,ctx){

  let label=m?m[1]:'', body=m&&m[2]!=null?m[2]:'';
  if(!m){ body=inner; }
  if(label && !body && ctx.fnByLabel[label]){
    const f=ctx.fnByLabel[label];
    const rid='rfn-'+(++ctx.refNo);
    return `<sup class="fn"><a href="#" id="${rid}" data-scroll="fn-${f.n}" title="${stripTags(f.html)}">[${esc(label)}]</a></sup>`;
  }
  const html=inline(body,ctx);
  const n=++ctx.fnNo;const rid='rfn-'+(++ctx.refNo);
  const f={n,label:label||String(n),html,rid};
  ctx.fns.push(f); if(label) ctx.fnByLabel[label]=f;

function splitArgs(s){ return String(s).split(',').map(x=>x.trim()); }
function kvArgs(parts){ const o={}; parts.forEach(p=>{ const k=p.indexOf('='); if(k>0) o[p.slice(0,k).trim()]=p.slice(k+1).trim(); }); return o; }

function inline(raw,ctx){

  while(i<raw.length){

    if(raw.startsWith('{{{',i)){ const j=findClose(raw,i+3,'{{{','}}}'); if(j>=0){ s+=P(renderBrace(raw.slice(i+3,j),ctx)); i=j+3; continue; } }

}
function buildList(items,ctx){
  let h='';const st=[];
  for(const it of items){
    const type=it.m==='*'?null:it.m[0].replace(/\d/,'1');
    const tag=type?'ol':'ul';
    const key=tag+(type||'');
    while(st.length && it.d<st[st.length-1].d) h+='</li></'+st.pop().tag+'>';
    if(st.length && it.d===st[st.length-1].d && st[st.length-1].key!==key) h+='</li></'+st.pop().tag+'>';
    if(!st.length || it.d>st[st.length-1].d){

function splitCells(row){
  const parts=[];let cur='';let d=0,lk=0;
  for(let k=0;k<row.length;k++){
    if(row.startsWith('{{{',k)){ d++; cur+='{{{'; k+=2; continue; }
    if(d&&row.startsWith('}}}',k)){ d--; cur+='}}}'; k+=2; continue; }
    if(!d&&row.startsWith('[[',k)){ lk++; cur+='[['; k++; continue; }
    if(!d&&lk&&row.startsWith(']]',k)){ lk--; cur+=']]'; k++; continue; }
    if(!d&&!lk&&row[k]==='\\'&&k+1<row.length){ cur+=row[k]+row[k+1]; k++; continue; }
    if(!d&&!lk&&row.startsWith('||',k)){ parts.push(cur); cur=''; k++; continue; }

function buildTable(rows,ctx){

  rows.forEach((raw,ri)=>{
    let r=raw.trim();
    if(ri===0&&!r.startsWith('||')){ const m=r.match(/^\|([^|]*)\|/); if(m){ caption=m[1]; r='||'+r.slice(m[0].length); } }
    r=r.slice(2,-2);
    const rowD=new Deco();
    let cells='',span=1,col=0;
    for(const p of splitCells(r)){
      if(p===''){ span++; continue; }
      cells+=buildCell(p,span,col,ctx,T,rowD,colDeco);

    }
    body+=`<tr${rowD.attr()}>${cells}</tr>`;
  });
  const ta=T.align==='center'?'margin-left:auto;margin-right:auto':T.align==='right'?'margin-left:auto':'';

function buildCell(p,span,col,ctx,T,rowD,colDeco){
  let s=p;const td=new Deco();const attrs=[];let m,align=null,valign=null,rowspan=0;
  if(colDeco[col]){ td.st.push(...colDeco[col].st); td.cls.push(...colDeco[col].cls); if(colDeco[col].hasBg) td.hasBg=true; if(colDeco[col].hasFg) td.hasFg=true; }

    const a=m[1].trim();let mm;
    if(/^-\d+$/.test(a)) span=Math.max(1,Math.min(+a.slice(1),50));
    else if((mm=a.match(/^([\^v])?\|(\d+)$/))){ rowspan=Math.min(+mm[2],200); valign=mm[1]==='^'?'top':mm[1]==='v'?'bottom':null; }

        else if(prop==='bordercolor') T.border=val;

      else if(scope==='col'){ const cd=colDeco[col]||(colDeco[col]=new Deco()); if(prop==='bgcolor'){ cd.bg(val); td.bg(val); } else if(prop==='color'){ cd.fg(val); td.fg(val); } }
      else { if(prop==='bgcolor') td.bg(val); else if(prop==='color') td.fg(val); else if(prop==='width'&&sizeVal(val)) td.st.push('width:'+sizeVal(val)); }

function flushFns(ctx){

function parseBlocks(lines,ctx,top){

      if(top){ while(ctx.secs.length&&ctx.secs[ctx.secs.length-1]>=depth){ out.push('</div>'); ctx.secs.pop(); } }
      ctx.heads.push({num,depth,html:inner,id});
      let edit='';
      if(top){ ctx.secLines.push({line:i,lv}); if(ctx.edit) edit=`<a class="hedit" href="#edit/${enc(ctx.self)}/${ctx.secLines.length}">[편집]</a>`; }
      const tag='h'+Math.min(depth+2,6);
      out.push(`<${tag} class="h l${Math.min(depth,5)}${folded?' folded':''}" id="${id}" data-name="${esc(stripTags(inner))}"><span class="hl"><a class="num" href="#" data-scroll="toc">${num}.</a> <span class="ht">${inner}</span></span>${edit}</${tag}>`);
      if(top){ out.push(`<div class="sec"${folded?' hidden':''}>`); ctx.secs.push(depth); }
      i++; continue;
    }
    if(/^-{4,9}$/.test(line.trimEnd())){ out.push('<hr>'); i++; continue; }

function renderBlock(head,buf,ctx){

  if(/^#!wiki/i.test(h)){
    const sm=h.match(/style\s*=\s*"([^"]*)"/i);const st=safeStyle(sm?sm[1]:'');
    const dm=h.match(/dark-style\s*=\s*"([^"]*)"/i);const dst=safeStyle(dm?dm[1]:'');

function includeBlock(arg,ctx){
  const ps=splitArgs(arg);const t=normTitle(ps[0]);const params=kvArgs(ps.slice(1));
  if(!t) return '';
  ctx.links.add(t);
  const p=pageOf(t);
  if(!p) return `<p><a class="wl red" href="#w/${enc(t)}">${esc(t)}</a></p>`;
  if(ctx.incDepth>=3||t===ctx.self) return '';
  let c=String(p.content||'').replace(/^#(redirect|넘겨주기)\s.*$/im,'');
  c=c.replace(/@([^@=\s\n]+)(?:=([^@\n]*))?@/g,(all,k,def)=>params[k]!=null?params[k]:def!=null?def:'');

  const h=parseBlocks(c.replace(/\r\n?/g,'\n').split('\n'),ctx,false);

let parseNo=0;
function parseWiki(src,self,opts){
  opts=opts||{};
  src=String(src||'').replace(/\r\n?/g,'\n').replace(/[\u0001-\u0005]/g,'');
  const lines=src.split('\n');
  const ctx={heads:[],fns:[],fnByLabel:{},fnNo:0,refNo:0,fnFlushed:0,cats:[],links:new Set(),self:self||'',tocDone:false,
    counters:[0,0,0,0,0,0,0,0],secs:[],secLines:[],edit:!!opts.edit,incDepth:0,noCats:false,wbNo:0,uid:'pw'+(++parseNo)};
  const rm=(lines[0]||'').match(/^#(redirect|넘겨주기)\s+(.+)$/i);
  if(rm){ const full=rm[2].trim();const h=full.indexOf('#');const tt=normTitle(h<0?full:full.slice(0,h)); if(tt){ ctx.redirect=tt; ctx.redirectAnchor=h<0?'':full.slice(h+1); ctx.links.add(tt); } }
  ctx.hasTocMacro=lines.some(l=>/^\s*\[(목차|tableofcontents)\]\s*$/i.test(l));
  const lv=[];let bd=0;
  lines.forEach(l=>{ if(bd===0){ const m=l.match(HEAD_RE); if(m) lv.push(m[1].length); } bd=Math.max(0,bd+countOf(l,/\{\{\{/g)-countOf(l,/\}\}\}/g)); });

  let html=parseBlocks(lines,ctx,true);
  const toc=ctx.heads.length?'<div class="toc" id="toc"><div class="toc-h">목차</div>'+ctx.heads.map(h=>
    `<div class="toc-i" style="padding-left:${h.depth*1.2}em"><a href="#" data-scroll="${h.id}"><span class="num">${h.num}.</span>${stripTags(h.html.replace(/<sup class="fn">[\s\S]*?<\/sup>/g,''))}</a></div>`).join('')+'</div>':'';

}

/* 이미지: files/{pid} 문서에서 불러옴 */
const fileCache=new Map();
function loadImages(root){
  if(!root||!db) return;
  root.querySelectorAll('img[data-fid]').forEach(img=>{
    const id=img.dataset.fid;
    if(!fileCache.has(id)) fileCache.set(id,db.doc('files/'+id).get().then(d=>d.exists?d.data().data:null).catch(()=>{ fileCache.delete(id); return null; }));
    fileCache.get(id).then(src=>{ if(src&&/^data:image\/(png|jpeg|gif|webp);base64,/.test(src)) img.src=src; else img.alt='(이미지를 불러오지 못했다)'; });
  });
}

/* 수식: KaTeX를 필요할 때만 불러와 MathML로 그림 */
let katexP=null;
function typeset(root){
  const els=root?root.querySelectorAll('.math[data-tex]'):[];
  if(!els.length) return;
  if(!katexP) katexP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  katexP.then(()=>{ els.forEach(el=>{ try{ el.innerHTML=window.katex.renderToString(el.dataset.tex,{output:'mathml',throwOnError:false}); el.removeAttribute('data-tex'); }catch(e){} }); }).catch(()=>{});
}


/* ---------------- data ---------------- */
function subscribePages(){
  if(pagesUnsub) pagesUnsub();
  pagesUnsub=db.collection('pages').onSnapshot(snap=>{
    pages.clear();
    snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.title) pages.set(d.id,v); });
    const first=!pagesReady;pagesReady=true;
    const r=currentRoute();
    if(first||LIVE.has(r.name)) renderMain();
    else if(r.name==='edit') updateEditConflict();
  },err=>{
    if(!pagesReady){ access='pending'; render(); }
  });
}
async function getRevs(pid,force){
  if(!force && revCache.has(pid)) return revCache.get(pid);
  const snap=await db.doc('pages/'+pid).collection('revs').orderBy('at','desc').limit(300).get();
  const list=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
  revCache.set(pid,list);
  return list;
}
async function savePage(title,content,summary,baseRev,force,extra){
  const pid=pidOf(title);
  const ref=db.doc('pages/'+pid);
  const cur=await ref.get();
  const old=cur.exists?cur.data():null;
  const curRev=old?(old.rev||0):0;
  if(!force && curRev!==baseRev) return {conflict:true,rev:curRev};
  const now=Date.now();
  const an=parseWiki(content,title);
  const rev=curRev+1;
  const size=content.length;
  const body={
    title,content,rev,size,
    links:an.links.map(pidOf).slice(0,500),
    cats:an.cats.slice(0,50),
    summary:String(summary||'').slice(0,200),
    updatedAt:now,updatedBy:myId,updatedByName:myName,
    createdAt:old?(old.createdAt||now):now,
    createdBy:old?(old.createdBy||null):myId
  };
  if(old&&old.file) body.file=old.file;
  if(extra) Object.assign(body,extra);
  await ref.set(body);
  const rid='r'+String(rev).padStart(6,'0')+'-'+Math.random().toString(36).slice(2,7);
  await ref.collection('revs').doc(rid).set({rev,content,size,delta:size-(old?(old.size||0):0),summary:body.summary,at:now,by:myId,byName:myName});
  revCache.delete(pid);
  return {ok:true,rev};
}
function errText(e){
  const c=e&&e.code;
  if(c==='permission-denied') return '권한이 없어요. 승인된 계정인지 확인해 주세요.';
  if(c==='resource-exhausted') return '오늘 쓸 수 있는 무료 사용량을 다 썼어요. 내일 다시 시도해 주세요.';
  if(c==='invalid-argument') return '문서가 너무 커서 저장할 수 없어요.';
  if(c==='unavailable') return '인터넷 연결을 확인하고 다시 시도해 주세요.';
  return '저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
}

/* ---------------- routing ---------------- */
function currentRoute(){
  const raw=location.hash.replace(/^#/,'');
  if(!raw) return {name:'front',title:site.front||'대문'};
  const k=raw.indexOf('/');
  const name=k<0?raw:raw.slice(0,k);
  const parts=(k<0?'':raw.slice(k+1)).split('/').map(x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } });
  return {name,title:normTitle(parts[0]||''),arg:parts[1]||''};
}

  const rdNote=(r.name==='wr'&&res.redirect)?`<div class="notice">이 문서는 ${wlink(res.redirect)} 문서로 넘겨주는 문서예요.</div>`:'';

function catListing(name){
  const list=[...pages.values()].filter(p=>(p.cats||[]).includes(name)).sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  return `<h2 style="font-size:18px;margin:28px 0 6px">"${esc(name)}" 분류에 속한 문서 <span class="muted" style="font-weight:400">(${list.length}개)</span></h2>`+
    (list.length?`<div class="cols">${groupByInitial(list)}</div>`:'<p class="muted">아직 없어요. 문서 안에 <code>[[분류:'+esc(name)+']]</code>를 적으면 여기에 모여요.</p>');
}
function similar(title){
  const q=title.toLowerCase();
  const list=[...pages.values()].filter(p=>p.title.toLowerCase().includes(q)||q.includes(p.title.toLowerCase())).slice(0,10);
  return list.length?`<p style="margin-top:22px" class="muted">비슷한 제목의 문서</p><ul>${list.map(p=>`<li>${wlink(p.title)}</li>`).join('')}</ul>`:'';
}
function initialOf(t){
  const c=t.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3){ return 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'[Math.floor((c-0xAC00)/588)].replace('ㄲ','ㄱ').replace('ㄸ','ㄷ').replace('ㅃ','ㅂ').replace('ㅆ','ㅅ').replace('ㅉ','ㅈ'); }
  const ch=t[0].toUpperCase(); return /[A-Z]/.test(ch)?ch:/[0-9]/.test(ch)?'0-9':'기타';
}
function groupByInitial(list){
  const g=new Map();
  list.forEach(p=>{ const k=initialOf(p.title); if(!g.has(k)) g.set(k,[]); g.get(k).push(p); });
  return [...g.entries()].map(([k,ps])=>`<div class="grp"><b>${esc(k)}</b>${ps.map(p=>wlink(p.title)).join('')}</div>`).join('');
}

function wrapSel(ta,a,z,ph){
  const s=ta.selectionStart,e=ta.selectionEnd;const sel=ta.value.slice(s,e)||ph;
  ta.setRangeText(a+sel+z,s,e,'end');
  ta.selectionStart=s+a.length; ta.selectionEnd=s+a.length+sel.length; ta.focus();
  editState.text=ta.value;
}
function insertText(ta,txt){ const s=ta.selectionStart; ta.setRangeText(txt,s,ta.selectionEnd,'end'); ta.focus(); editState.text=ta.value; }
function updateEditConflict(){
  const box=document.getElementById('ed-conflict'); if(!box||!editState) return;
  const p=pageOf(editState.title);
  const cur=p?(p.rev||0):0;
  if(cur!==editState.baseRev){
    box.innerHTML=`<div class="notice warn">편집하는 사이에 다른 멤버가 이 문서를 고쳤어요 (지금 <span class="rv">r${cur}</span>). 그대로 저장하면 그 수정 내용을 덮어써요. <a href="#history/${enc(editState.title)}">역사에서 확인</a></div>`;
  } else box.innerHTML='';
}
async function doSave(){
  const E=editState; if(!E) return;
  const btn=document.getElementById('ed-save'),msg=document.getElementById('ed-msg');
  if(!E.text.trim()&&!E.sec){ msg.className='msg err'; msg.textContent='내용이 비어 있으면 저장할 수 없어요.'; return; }
  if(new Blob([E.text]).size>200000){ msg.className='msg err'; msg.textContent='문서가 너무 길어요. 여러 문서로 나눠 주세요.'; return; }
  btn.disabled=true; msg.className='msg'; msg.textContent='저장하는 중…';
  try{
    let full=E.text;
    if(E.sec&&E.range){ const L=E.base.split('\n'); full=L.slice(0,E.range[0]).concat(E.text.split('\n'),L.slice(E.range[1])).join('\n'); }
    const res=await savePage(E.title,full,E.summary,E.baseRev,E.confirm);
    if(res.conflict){
      E.confirm=true; btn.disabled=false; btn.textContent='그래도 저장';
      msg.className='msg err'; msg.textContent=`다른 멤버가 먼저 저장했어요 (r${res.rev}). 한 번 더 누르면 내 내용으로 덮어써요.`;
      updateEditConflict(); return;
    }
    const t=E.title; editState=null; location.hash='#w/'+enc(t);
  }catch(e){ btn.disabled=false; msg.className='msg err'; msg.textContent=errText(e); }
}

  if(stale(seq)) return;

  main.innerHTML=`<article class="doc">${head}<ul class="lst">${revs.map((v,k)=>`<li>
      <time>${fmtTime(v.at)}</time>
      <div><a class="rv" href="#rev/${enc(title)}/${enc(v.id)}">r${v.rev}</a> ${delta(v.delta)} · ${who(v.by,v.byName)}
        <span class="acts">${k<revs.length-1?`<a href="#diff/${enc(title)}/${enc(v.id)}">비교</a>`:''}${v.rev!==curRev?`<button type="button" data-revert="${esc(v.id)}">이 버전으로 되돌리기</button>`:''}</span></div>
      ${v.summary?`<div class="sub"><em>${esc(v.summary)}</em></div>`:''}
    </li>`).join('')}</ul><div class="msg" id="h-msg" role="status"></div></article>`;
  main.querySelectorAll('[data-revert]').forEach(b=>b.onclick=()=>revertTo(title,b.dataset.revert,b));
}
async function revertTo(title,rid,btn){
  const list=revCache.get(pidOf(title))||[];const v=list.find(x=>x.id===rid);
  const msg=document.getElementById('h-msg')||document.getElementById('rv-msg');
  if(!v) return;
  if(btn.dataset.armed!=='1'){ btn.dataset.armed='1'; btn.textContent=`r${v.rev}으로 되돌릴까요? 한 번 더 누르기`; return; }
  btn.disabled=true;
  try{
    const p=pageOf(title);
    await savePage(title,v.content,`r${v.rev}으로 되돌림`,p?(p.rev||0):0,true);
    location.hash='#w/'+enc(title);
  }catch(e){ btn.disabled=false; if(msg){ msg.className='msg err'; msg.textContent=errText(e); } }
}

  main.innerHTML=`<article class="doc"><div class="skel" style="width:40%;height:26px"></div><div class="skel"></div></article>`;
  const list=await getRevs(pidOf(title));

  if(!v){ main.innerHTML=`<article class="doc"><p class="muted">그 버전을 찾지 못했어요. <a href="#history/${enc(title)}">역사로 돌아가기</a></p></article>`; return; }
  const p=pageOf(title);const isCur=p&&v.rev===(p.rev||0);
  main.innerHTML=`<article class="doc">
    <div class="doc-head"><h1 class="title">${titleHTML(title)} <small>(r${v.rev} 판)</small></h1><div class="btns"><a href="#w/${enc(title)}">현재 버전</a><a href="#history/${enc(title)}">역사</a></div></div>

    <div class="msg" id="rv-msg" role="status"></div>
    <div class="content">${parseWiki(v.content,title).html}</div></article>`;
  const b=document.getElementById('rv-btn'); if(b) b.onclick=()=>revertTo(title,v.id,b);
}
function diffLines(a,b){
  const A=a.split('\n'),B=b.split('\n');const n=A.length,m=B.length;
  if(n*m>4e6) return null;
  const dp=[];for(let i=0;i<=n;i++) dp.push(new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){ out.push([' ',A[i]]); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ out.push(['-',A[i]]); i++; } else { out.push(['+',B[j]]); j++; } }
  while(i<n) out.push(['-',A[i++]]); while(j<m) out.push(['+',B[j++]]);
  return out;
}
async function viewDiff(r,seq){
  const title=r.title;
  main.innerHTML=`<article class="doc"><div class="skel" style="width:40%;height:26px"></div><div class="skel"></div></article>`;
  const list=await getRevs(pidOf(title));
  if(stale(seq)) return;
  const k=list.findIndex(x=>x.id===r.arg);
  const v=list[k],prev=list[k+1];
  const head=`<div class="doc-head"><h1 class="title">${titleHTML(title)} <small>(비교)</small></h1><div class="btns"><a href="#w/${enc(title)}">문서로</a><a href="#history/${enc(title)}">역사</a></div></div>`;
  if(!v||!prev){ main.innerHTML=`<article class="doc">${head}<p class="muted">비교할 이전 버전이 없어요.</p></article>`; return; }
  const d=diffLines(prev.content||'',v.content||'');
  let body='';
  if(!d) body='<p class="muted">문서가 너무 길어서 비교를 보여줄 수 없어요.</p>';
  else{
    const keep=new Array(d.length).fill(false);
    d.forEach((x,i)=>{ if(x[0]!==' ') for(let q=Math.max(0,i-2);q<=Math.min(d.length-1,i+2);q++) keep[q]=true; });
    let h='',skipped=0;
    d.forEach((x,i)=>{
      if(!keep[i]){ skipped++; return; }
      if(skipped){ h+=`<div class="s">… 같은 줄 ${skipped}개 …</div>`; skipped=0; }
      h+=`<div class="${x[0]==='+'?'a':x[0]==='-'?'d':''}">${x[0]==='+'?'+ ':x[0]==='-'?'- ':'  '}${esc(x[1])}</div>`;
    });
    if(skipped) h+=`<div class="s">… 같은 줄 ${skipped}개 …</div>`;
    body=`<div class="diff">${h||'<div class="s">바뀐 내용이 없어요.</div>'}</div>`;
  }
  main.innerHTML=`<article class="doc">${head}<p style="margin:14px 0 0"><span class="rv">r${prev.rev}</span> → <span class="rv">r${v.rev}</span> · ${fmtTime(v.at)} · ${who(v.by,v.byName)} ${delta(v.delta)}${v.summary?` · <span class="muted">${esc(v.summary)}</span>`:''}</p>${body}</article>`;
}

  const exact=pageOf(q);

  const f=document.getElementById('u-file'),nm=document.getElementById('u-name'),pv=document.getElementById('u-prev'),msg=document.getElementById('u-msg'),go=document.getElementById('u-go');

      location.hash='#w/'+enc(title);
    }catch(e){ go.disabled=false; err(e&&e.message==='too-big'?'이미지를 충분히 줄이지 못했어요. 더 작은 이미지로 해 주세요.':errText(e)); }

function readAsDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
async function shrinkImage(file){
  const LIMIT=900000; // Firestore 문서 1MB 제한 안쪽
  const bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
  const W=bmp.naturalWidth,H=bmp.naturalHeight;
  const orig=await readAsDataURL(file);
  if(orig.length<=LIMIT && Math.max(W,H)<=2000) return {data:orig,type:file.type,w:W,h:H,size:file.size};
  const keepAlpha=file.type==='image/png'||file.type==='image/webp';
  let max=1600,q=0.86;
  for(let k=0;k<8;k++){
    const sc=Math.min(1,max/Math.max(W,H));const w=Math.round(W*sc),h=Math.round(H*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const cx=c.getContext('2d'); if(!keepAlpha){ cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); } cx.drawImage(bmp,0,0,w,h);
    const type=keepAlpha?'image/webp':'image/jpeg';
    const data=c.toDataURL(type,q);
    if(data.length<=LIMIT && data.startsWith('data:'+type)) return {data,type,w,h,size:Math.round(data.length*0.75)};
    if(!data.startsWith('data:'+type)){ const j=c.toDataURL('image/jpeg',q); if(j.length<=LIMIT) return {data:j,type:'image/jpeg',w,h,size:Math.round(j.length*0.75)}; }
    max=Math.round(max*0.8); q=Math.max(0.6,q-0.06);
  }
  throw new Error('too-big');
}

/* ---------------- global interactions ---------------- */
function scrollToAnchor(name){
  if(!name) return;
  let el=document.getElementById(name);
  if(!el){ const hs=[...main.querySelectorAll('.content .h')]; el=hs.find(h=>h.dataset.name===name)||null; }
  if(!el) return;
  let sec=el.closest('.sec'); while(sec){ if(sec.hidden){ sec.hidden=false; const h=sec.previousElementSibling; if(h) h.classList.remove('folded'); } sec=sec.parentElement&&sec.parentElement.closest('.sec'); }
  const smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
document.addEventListener('click',e=>{
  const sc=e.target.closest('[data-scroll]');
  if(sc){ e.preventDefault(); scrollToAnchor(sc.dataset.scroll); return; }
  const an=e.target.closest('a[data-anchor]');
  if(an){
    const r=currentRoute();const target=decodeURIComponent((an.getAttribute('href')||'').replace(/^#w\//,''));
    const curTitle=(r.name==='w'||r.name==='wr'||r.name==='front')?(r.title||site.front):null;
    if(curTitle&&normTitle(target)===curTitle){ e.preventDefault(); scrollToAnchor(an.dataset.anchor); }
    else pendingAnchor=an.dataset.anchor;
    return;
  }
  const h=e.target.closest('.content .h');
  if(h && !e.target.closest('a') && h.nextElementSibling && h.nextElementSibling.classList.contains('sec')){
    const sec=h.nextElementSibling; sec.hidden=!sec.hidden; h.classList.toggle('folded',sec.hidden);
  }
});
(function(){
  const form=document.getElementById('sform'),q=document.getElementById('q'),sg=document.getElementById('sugg');
  let idx=-1;
  const matches=()=>{ const v=q.value.trim().toLowerCase(); if(!v) return [];
    return [...pages.values()].filter(p=>p.title.toLowerCase().includes(v)).sort((a,b)=>(a.title.toLowerCase().startsWith(v)?0:1)-(b.title.toLowerCase().startsWith(v)?0:1)||a.title.length-b.title.length).slice(0,8); };
  const draw=()=>{ const m=matches(); if(!m.length){ sg.hidden=true; return; }
    sg.innerHTML=m.map((p,k)=>`<a href="#w/${enc(p.title)}" class="${k===idx?'on':''}">${esc(p.title)}</a>`).join(''); sg.hidden=false; };
  q.addEventListener('input',()=>{ idx=-1; draw(); });
  q.addEventListener('keydown',e=>{ const n=sg.querySelectorAll('a').length; if(sg.hidden||!n) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); idx=(idx+1)%n; draw(); } else if(e.key==='ArrowUp'){ e.preventDefault(); idx=(idx-1+n)%n; draw(); } else if(e.key==='Escape'){ sg.hidden=true; } });
  q.addEventListener('blur',()=>setTimeout(()=>{ sg.hidden=true; },150));
  sg.addEventListener('click',()=>{ sg.hidden=true; q.value=''; });
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const m=matches(); const v=normTitle(q.value); if(!v) return;
    let target;
    if(idx>=0&&m[idx]) target='#w/'+enc(m[idx].title);
    else if(pageOf(v)) target='#w/'+enc(v);
    else target='#search/'+enc(v);
    sg.hidden=true; q.value=''; idx=-1; q.blur(); location.hash=target;
  });
})();

/* ---------------- boot ---------------- */
function stopListeners(){
  if(userUnsub){ userUnsub(); userUnsub=null; }
  if(pagesUnsub){ pagesUnsub(); pagesUnsub=null; }
  if(window._usersUnsub){ window._usersUnsub(); window._usersUnsub=null; }
}
function startUser(user){
  stopListeners();
  myId=user.uid;
  myName=String(user.email||'').split('@')[0];
  isOwner=myName===ADMIN_ID;
  if(isOwner){ enterWiki(); return; }
  userUnsub=db.doc('users/'+user.uid).onSnapshot(d=>{
    const st=d.exists?d.data().status:'pending';
    if(st==='approved'){ if(access!=='ok') enterWiki(); }
    else { if(pagesUnsub){ pagesUnsub(); pagesUnsub=null; } pagesReady=false; pages.clear(); access=st==='blocked'?'blocked':'pending'; render(); }
  },()=>{ access='pending'; render(); });
}
async function enterWiki(){
  access='ok'; pagesReady=false;
  try{
    const s=await db.doc('config/site').get();
    if(s.exists){ const d=s.data()||{}; site={name:d.name||site.name,front:d.front||'대문',help:d.help||site.help}; }
    else if(isOwner) await seedWiki();
  }catch(e){}
  render();
  subscribePages();
}

  const SEED={"대문": "== 여기는 어떤 곳? ==\n'''풍만위키'''는 1학년 2반의 위키이다. 초대받은 사람만 들어올 수 있는 비공개 위키로, 로그인한 멤버라면 누구나 문서를 만들고 고칠 수 있다.\n\n== 시작하기 ==\n * 위쪽 검색창에 아직 없는 제목을 치면 그 이름으로 새 문서를 만들 수 있다.\n * 문서 오른쪽 위 '''편집'''으로 고치고, '''역사'''에서 예전 버전을 보거나 되돌릴 수 있다.\n * 문단 제목 옆 '''[편집]'''을 누르면 그 문단만 고칠 수 있다.\n * 사진은 위쪽 '''파일 올리기'''로 올린 다음 {{{[[파일:이름]]}}}으로 넣는다.\n * 문법은 나무위키와 같다. 자세한 건 [[풍만위키:문법 도움말]]을 보면 된다.", "풍만위키:문법 도움말": "[목차]\n== 개요 ==\n'''풍만위키'''에서 문서를 쓸 때 쓰는 문법을 정리한 문서이다. 풍만위키는 나무위키 문법(나무마크)을 그대로 따른다.[* 이 문서는 [[https://namu.wiki/w/나무위키:문법 도움말|나무위키:문법 도움말]]의 구성을 참고해서 만들었다.]\n\n편집 화면의 '''미리보기''' 탭을 누르면 저장하기 전에 결과를 볼 수 있다. 문단 제목 옆 '''[편집]'''을 누르면 그 문단만 고칠 수도 있다.\n\n== 텍스트 ==\n=== 형태 ===\n||<:> '''입력''' ||<:> '''출력''' ||\n|| {{{'''굵게'''}}} || '''굵게''' ||\n|| {{{''기울임''}}} || ''기울임'' ||\n|| {{{__밑줄__}}} || __밑줄__ ||\n|| {{{~~취소선~~}}} || ~~취소선~~ ||\n|| {{{--취소선--}}} || --취소선-- ||\n|| {{{가^^위첨자^^}}} || 가^^위첨자^^ ||\n|| {{{가,,아래첨자,,}}} || 가,,아래첨자,, ||\n|| {{{''' ''굵게 기울임'' '''}}} || ''' ''굵게 기울임'' ''' ||\n\n서식 안에서 줄을 바꾸고 싶으면 엔터 대신 {{{[br]}}}을 쓴다.\n\n=== 크기 ===\n글자 크기는 {{{+1}}}부터 {{{+5}}}, {{{-1}}}부터 {{{-5}}}까지 있다.\n||<:> '''입력''' ||<:> '''출력''' ||\n|| {{{{{{+1 크게}}}}}} || {{{+1 크게}}} ||\n|| {{{{{{+3 더 크게}}}}}} || {{{+3 더 크게}}} ||\n|| {{{{{{+5 가장 크게}}}}}} || {{{+5 가장 크게}}} ||\n|| {{{{{{-1 작게}}}}}} || {{{-1 작게}}} ||\n|| {{{{{{-3 더 작게}}}}}} || {{{-3 더 작게}}} ||\n\n=== 색상 ===\n헥스 코드(3자리, 6자리)나 CSS 색 이름을 쓸 수 있다. 쉼표 뒤에 색을 하나 더 쓰면 다크 모드에서는 그 색으로 보인다.\n||<:> '''입력''' ||<:> '''출력''' ||\n|| {{{{{{#ff0000 빨강}}}}}} || {{{#ff0000 빨강}}} ||\n|| {{{{{{#f00 빨강}}}}}} || {{{#f00 빨강}}} ||\n|| {{{{{{#blue 파랑}}}}}} || {{{#blue 파랑}}} ||\n|| {{{{{{#555,#ffd400 라이트/다크}}}}}} || {{{#555,#ffd400 라이트/다크}}} ||\n\n== 하이퍼링크 ==\n||<:> '''입력''' ||<:> '''출력''' ||<:> '''설명''' ||\n|| {{{[[대문]]}}} || [[대문]] || 기본 링크 ||\n|| {{{[[대문|첫 화면]]}}} || [[대문|첫 화면]] || 보이는 글자 바꾸기 ||\n|| {{{[[풍만위키:문법 도움말#s-5|문단 링크]]}}} || [[풍만위키:문법 도움말#s-5|문단 링크]] || 다른 문서의 특정 문단 ||\n|| {{{[[#개요]]}}} || [[#개요]] || 이 문서 안 문단 (문단 이름) ||\n|| {{{[[#s-2.3]]}}} | , 다시 누르면 펼쳐진다.\n * {{{==# 제목 #==}}}처럼 {{{#}}}을 넣으면 처음부터 접힌 문단이 된다.\n\n===# 접힌 문단 예시 #===\n처음에는 접혀 있다가, 제목을 누르면 보이는 문단이다.\n\n== 리스트 ==\n리스트는 줄 맨 앞에 '''공백 한 칸'''이 꼭 있어야 한다. 공백을 더 넣으면 한 단계 안쪽으로 들어간다.\n{{{\n * 항목 1\n * 항목 2\n  * 항목 2-1\n   * 항목 2-1-1\n}}}\n * 항목 1\n * 항목 2\n  * 항목 2-1\n   * 항목 2-1-1\n\n{{{*}}} 대신 아래 기호를 쓰면 번호가 붙은 리스트가 된다.\n||<:> '''입력''' ||<:> '''출력''' ||\n|| {{{ 1.}}} || 1, 2, 3 ||\n|| {{{ a.}}} || a, b, c ||\n|| {{{ A.}}} || A, B, C ||\n|| {{{ i.}}} || i, ii, iii ||\n|| {{{ I.}}} || I, II, III ||\n{{{\n 1. 첫째\n 1. 둘째\n 1.#10 열 번째부터 다시 시작\n 1. 열한 번째\n}}}\n 1. 첫째\n 1. 둘째\n 1.#10 열 번째부터 다시 시작\n 1. 열한 번째\n\n=== 들여쓰기 ===\n리스트 기호 없이 줄 앞에 공백만 넣으면 들여쓰기가 된다.\n{{{\n 한 칸 들여쓰기\n  두 칸 들여쓰기\n}}}\n 한 칸 들여쓰기\n  두 칸 들여쓰기\n\n== 각주 ==\n{{{\n문장[* 각주 내용]\n문장[*A 이름을 붙인 각주]\n같은 각주 다시 쓰기[*A]\n}}}\n문장[* 각주 내용] 문장[*A 이름을 붙인 각주] 같은 각주 다시 쓰기[*A]\n\n각주는 문서 맨 아래에 모인다. {{{[각주]}}}를 쓰면 그 자리까지 나온 각주를 거기에 보여준다. 각주 번호에 마우스를 올리면 내용이 미리 보인다.\n\n== 인용문 ==\n{{{\n> 인용문\n>> 인용문 속 인용문\n}}}\n> 인용문\n>> 인용문 속 인용문\n\n== 수평줄 ==\n하이픈({{{-}}})을 4개에서 9개까지 한 줄에 쓰면 가로줄이 생긴다.\n{{{\n----\n}}}\n----\n\n== 매크로 ==\n||<:> '''입력''' ||<:> '''출력''' ||<:> '''설명''' ||\n|| {{{[br]}}} || 줄[br]바꿈 || 줄바꿈 ||\n|| {{{[clearfix]}}} || - || 이미지 옆으로 흐르는 글자 끊기 ||\n|| {{{[date]}}} || [date] || 오늘 날짜 ||\n|| {{{[datetime]}}} || [datetime] || 지금 날짜와 시간 ||\n|| {{{[age(2008-01-01)]}}} || [age(2008-01-01)] || 그 날짜부터 지금까지의 만 나이 ||\n|| {{{[dday(2026-12-25)]}}} || [dday(2026-12-25)] || 그 날짜까지 남은 날(-)이나 지난 날(+) ||\n|| {{{[pagecount]}}} || [pagecount] || 풍만위키 전체 문서 수 ||\n|| {{{[목차]}}} || - || 그 자리에 목차 넣기 ({{{[tableofcontents]}}}도 같음) ||\n|| {{{[각주]}}} || - || 그 자리에 각주 모으기 ({{{[footnote]}}}도 같음) ||\n|| {{{[ruby(風滿,ruby=풍만)]}}} || [ruby(風滿,ruby=풍만)] || 글자 위에 작은 글자 ||\n|| {{{[math(E = mc^2)]}}} || [math(E = mc^2)] || 수식 (LaTeX) ||\n|| {{{[include(틀:이름)]}}} || - || 다른 문서(틀) 내용 불러오기 ||\n\n=== 틀 불러오기 ===\n{{{[include(틀:이름, 인자=값)]}}}처럼 쓰면 그 틀 안의 {{{@인자@}}} 자리에 값이 들어간다. 틀에서 {{{@인자=기본값@}}}처럼 쓰면 값을 안 줬을 때 기본값이 들어간다.\n{{{\n[include(틀:알림, 내용=이렇게 틀을 불러올 수 있다.)]\n}}}\n[include(틀:알림, 내용=이렇게 틀을 불러올 수 있다.)]\n\n== 테이블(표) ==\n=== 기본 ===\n{{{\n||칸1||칸2||\n||칸3||칸4||\n}}}\n||칸1||칸2||\n||칸3||칸4||\n\n맨 위에 {{{|제목|}}}을 붙이면 표 제목(캡션)이 된다.\n{{{\n|간식 순위|1위||떡볶이||\n||2위||치킨||\n}}}\n|간식 순위|1위||떡볶이||\n||2위||치킨||\n\n=== 셀 합치기 ===\n{{{\n||<-2> 가로 두 칸 ||\n||<|2> 세로 두 칸 || 오른쪽 위 ||\n|| 오른쪽 아래 ||\n}}}\n||<-2> 가로 두 칸 ||\n||<|2> 세로 두 칸 || 오른쪽 위 ||\n|| 오른쪽 아래 ||\n\n{{{<^|2>}}}는 위에 붙은 세로 병합, {{{<v|2>}}}는 아래에 붙은 세로 병합이다. {{{||||}}}처럼 칸을 비워서 써도 가로로 합쳐진다.\n\n=== 정렬 ===\n{{{\n||<(> 왼쪽 ||<:> 가운데 ||<)> 오른쪽 ||\n||왼쪽 || 가운데 || 오른쪽||\n}}}\n||<(> 왼쪽 ||<:> 가운데 ||<)> 오른쪽 ||\n||왼쪽 || 가운데 || 오른쪽||\n\n기호 대신 공백으로도 정렬된다. 오른쪽에만 공백을 두면 왼쪽, 양쪽에 두면 가운데, 왼쪽에만 두면 오른쪽 정렬이다.\n\n=== 색 ===\n{{{\n||<bgcolor=#1c7a57><color=#ffffff> 배경색과 글자색 ||<#ffe08a> 배경색 줄여 쓰기 ||\n||<bgcolor=#dff3e6,#173826> 라이트/다크 배경 || 보통 칸 ||\n}}}\n||<bgcolor=#1c7a57><color=#ffffff> 배경색과 글자색 ||<#ffe08a> 배경색 줄여 쓰기 ||\n||<bgcolor=#dff3e6,#173826> 라이트/다크 배경 || 보통 칸 ||\n\n=== 크기 ===\n||<:> '''입력''' ||<:> '''설명''' ||\n|| {{{<width=100>}}}, {{{<width=50%>}}} || 칸 너비 ||\n|| {{{<height=60>}}} || 칸 높이 ||\n|| {{{<nopad>}}} || 칸 안쪽 여백 없애기 (이미지 넣을 때) ||\n\n=== 표 전체, 행, 열 속성 ===\n아무 칸에나 쓰면 표 전체에, {{{row}}}는 그 줄 전체에, {{{col}}}은 그 칸부터 아래쪽 같은 열에 적용된다.\n||<:> '''입력''' ||<:> '''설명''' ||\n|| {{{<tablealign=center>}}} || 표 위치 (left, center, right) ||\n|| {{{<tablewidth=100%>}}} || 표 너비 ||\n|| {{{<tablebgcolor=#색>}}} || 표 배경색 ||\n|| {{{<tablecolor=#색>}}} || 표 글자색 ||\n|| {{{<tablebordercolor=#색>}}} || 표 테두리색 ||\n|| {{{<rowbgcolor=#색>}}}, {{{<rowcolor=#색>}}} || 줄 배경색, 글자색 ||\n|| {{{<colbgcolor=#색>}}}, {{{<colcolor=#색>}}} || 열 배경색, 글자색 ||\n{{{\n||<tablealign=center><tablewidth=300><tablebordercolor=#1c7a57><rowbgcolor=#1c7a57><rowcolor=#ffffff><:> 과목 ||<:> 점수 ||\n||<colbgcolor=#dff3e6,#173826> 국어 ||<:> 92 ||\n|| 수학 ||<:> 88 ||\n}}}\n||<tablealign=center><tablewidth=300><tablebordercolor=#1c7a57><rowbgcolor=#1c7a57><rowcolor=#ffffff><:> 과목 ||<:> 점수 ||\n||<colbgcolor=#dff3e6,#173826> 국어 ||<:> 92 ||\n|| 수학 ||<:> 88 ||\n\n=== 여러 줄 칸 ===\n칸이 {{{||}}}로 끝나기 전까지 엔터를 쳐도 한 칸으로 이어져서, 칸 안에 리스트 같은 것도 넣을 수 있다.\n{{{\n|| 준비물\n * 필통\n * 체육복 || 내일 ||\n}}}\n|| 준비물\n * 필통\n * 체육복 || 내일 ||\n\n== 접기 ==\n{{{\n{{{#!folding [ 펼치기 · 접기 ]\n접혀 있던 내용이다.\n}}}\n}}}\n{{{#!folding [ 펼치기 · 접기 ]\n접혀 있던 내용이다. 스포일러를 숨길 때 좋다.\n}}}\n\n=== 위키 스타일 ===\n{{{#!wiki style=\"...\"}}}로 상자를 만들고 스타일을 줄 수 있다. {{{dark-style=\"...\"}}}을 같이 쓰면 다크 모드용 스타일이 된다. 첫 줄에 {{{#!folding}}}을 쓰면 스타일이 들어간 접기 상자가 된다.\n{{{\n{{{#!wiki style=\"border:2px solid #1c7a57; border-radius:6px; padding:8px 12px; text-align:center\"\n가운데 정렬된 초록 테두리 상자\n}}}\n}}}\n{{{#!wiki style=\"border:2px solid #1c7a57; border-radius:6px; padding:8px 12px; text-align:center\"\n가운데 정렬된 초록 테두리 상자\n}}}\n\n== 분류 ==\n문서 아무 곳에나 {{{[[분류:분류 이름]]}}}을 쓰면 문서 위쪽에 분류가 붙고, {{{분류:분류 이름}}} 문서에 이 문서가 모인다. 한 문서에 여러 개를 달아도 된다. {{{[[분류:이름#blur]]}}}처럼 써도 똑같이 분류된다.\n\n분류 문서로 가는 링크를 만들 때는 앞에 {{{:}}}를 붙여서 {{{[[:분류:위키 안내]]}}}처럼 쓴다.\n\n== 문법 무효화 ==\n{{{\\}}} 뒤의 글자 하나는 문법으로 읽지 않는다. 여러 글자는 {{{{{{ }}}}}}로 감싸면 문법이 안 먹고 고정폭 글자로 보인다.\n||<:> '''입력''' ||<:> '''출력''' ||\n|| {{{\\[[대문]]}}} || \\[[대문]] ||\n|| {{{\\~~취소선 아님~~}}} || \\~~취소선 아님~~ ||\n|| {{{{{{[[대문]]}}}}}} || {{{[[대문]]}}} ||\n\n여러 줄 코드는 {{{{{{}}}}}}을 줄마다 나눠서 쓰고, {{{#!syntax 언어}}}를 붙이면 언어 이름이 같이 보인다.\n{{{\n{{{#!syntax python\nfor i in range(3):\n    print(i)\n}}}\n}}}\n{{{#!syntax python\nfor i in range(3):\n    print(i)\n}}}\n\n== 편집 창에서만 노출(주석) ==\n줄 맨 앞에 {{{##}}}을 쓰면 그 줄은 편집 화면에서만 보이고 문서에는 안 나온다.\n{{{\n## 이 줄은 문서에 안 보인다\n}}}\n## 이 줄은 문서에 안 보인다\n바로 위 줄에 주석이 있지만 보이지 않는다.\n\n== 기본 색 ==\n풍만위키에서 쓰는 기본 색이다.\n||<:> '''이름''' ||<:> '''헥스 코드''' ||<:> '''색''' ||\n|| 대표색 || {{{#1c7a57}}} ||<bgcolor=#1c7a57> ||\n|| 링크 || {{{#1f62b3}}} ||<bgcolor=#1f62b3> ||\n|| 없는 문서 링크 || {{{#cc3a2a}}} ||<bgcolor=#cc3a2a> ||\n|| 기본 글자 (라이트) || {{{#1b2420}}} ||<bgcolor=#1b2420> ||\n|| 기본 글자 (다크) || {{{#e2eae6}}} ||<bgcolor=#e2eae6> ||\n\n[[분류:위키 안내]]", "위키 문법": "#redirect 풍만위키:문법 도움말", "틀:알림": "{{{#!wiki style=\"border:1px solid #1c7a57; border-left:5px solid #1c7a57; border-radius:4px; padding:8px 12px; background:#eef7f2\" dark-style=\"background:#15251d; border-color:#3fae84\"\n'''알림''' · @내용=여기에 알림 내용이 들어간다.@\n}}}\n## 쓰는 법: [include(틀:알림, 내용=보여줄 글)]"};
  const now=Date.now();
  await db.doc('config/site').set({name:'풍만위키',front:'대문',help:'풍만위키:문법 도움말'});
  for(const t of Object.keys(SEED)){
    const ex=await db.doc('pages/'+pidOf(t)).get();
    if(!ex.exists) await savePage(t,SEED[t],'처음 문서 만들기',0,true);
  }
}
function boot(){
  renderHeader();
  if(!window.firebase||/여기에_/.test(FIREBASE_CONFIG.apiKey||'')){ access='setup'; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth(); db=firebase.firestore();
  auth.onAuthStateChanged(user=>{
    if(!user){ stopListeners(); myId=null; myName=''; isOwner=false; pages.clear(); pagesReady=false; access='login'; render(); return; }
    startUser(user);
  });
}
boot();
})();
